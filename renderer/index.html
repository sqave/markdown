<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cog</title>
  <script>
    (function() {
      var saved = localStorage.getItem('cogmd-theme');
      var theme = (saved === 'light' || saved === 'dark') ? saved
        : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="titlebar" data-tauri-drag-region>
    <div class="titlebar-left" data-tauri-drag-region>
    </div>

    <div class="titlebar-actions" data-tauri-drag-region>
      <button class="titlebar-btn" id="sidebarNewBtn" title="New (⌘N)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      <button class="copy-btn titlebar-btn" id="copyBtn" title="Copy markdown (⌘⇧C)">
        <svg class="icon-clipboard" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="11" height="11" rx="2"/>
          <path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/>
        </svg>
        <svg class="icon-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </button>
      <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Toggle sidebar (⌘⇧E)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
      </button>
      <button class="open-folder-btn hidden" id="openFolderBtn" title="Open containing folder">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v2"/>
          <path d="M3 10h18l-2 8H5l-2-8z"/>
        </svg>
      </button>

      <button class="sync-btn hidden" id="syncBtn" title="Check for external file changes and sync">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 5v5h-5"/>
          <path d="M4 19v-5h5"/>
          <path d="M18.2 8.8A7 7 0 0 0 6 10"/>
          <path d="M5.8 15.2A7 7 0 0 0 18 14"/>
        </svg>
      </button>

      <!-- [hidden] <div id="pluginToolbarSlot"></div> -->

      <div class="display-menu" id="displayMenu">
        <button class="display-menu-toggle" id="displayMenuToggle" title="Display options" aria-haspopup="true" aria-expanded="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="6" x2="20" y2="6"/>
            <circle cx="9" cy="6" r="2"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <circle cx="15" cy="12" r="2"/>
            <line x1="4" y1="18" x2="20" y2="18"/>
            <circle cx="11" cy="18" r="2"/>
          </svg>
        </button>
        <div class="display-menu-popover" id="displayMenuPopover">
          <button class="theme-toggle" id="themeToggle" title="Toggle theme (⌘⇧T)">
            <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg class="icon-auto" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </button>
          <button class="font-btn" id="fontDecrease" title="Decrease font size (⌘−)">
            <span class="font-glyph font-glyph-sm">A</span>
          </button>
          <button class="font-btn" id="fontIncrease" title="Increase font size (⌘+)">
            <span class="font-glyph font-glyph-lg">A</span>
          </button>
        </div>
      </div>

      <div class="mode-toggle">
        <button class="mode-btn active" data-layout="single" title="Editor only (⌘1)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
          </svg>
        </button>
        <div class="split-menu" id="splitMenu">
          <button class="mode-btn split-menu-toggle" id="splitMenuToggle" data-layout="split" title="Split view (⌘2)" aria-haspopup="true" aria-expanded="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/>
            </svg>
          </button>
          <div class="split-menu-popover" id="splitMenuPopover">
            <button class="split-option-btn active" data-right="preview" title="Preview (⌘3)" aria-label="Preview pane">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
            <button class="split-option-btn" data-right="diff" title="Changes (⌘4)" aria-label="Changes pane">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 6h7"/><path d="M4 10h7"/><path d="M4 14h4"/><path d="M15 6h5"/><path d="M15 10h5"/><path d="M15 14h5"/><line x1="12" y1="3" x2="12" y2="21"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="app-body">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-section collapsed" id="sidebarFavoritesSection" style="display:none">
        <div class="sidebar-header collapsible" id="sidebarFavoritesHeader">
          <span class="sidebar-title">Favorites</span>
          <svg class="sidebar-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="sidebar-list" id="sidebarFavorites"></div>
      </div>
      <div class="sidebar-section sidebar-section-opened">
        <div class="sidebar-header">
          <span class="sidebar-title">Opened</span>
        </div>
        <div class="sidebar-list" id="sidebarOpened"></div>
      </div>
      <div class="sidebar-section collapsed" id="sidebarRecentSection">
        <div class="sidebar-header collapsible" id="sidebarRecentHeader">
          <span class="sidebar-title">Recently Opened</span>
          <svg class="sidebar-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="sidebar-list" id="sidebarRecent"></div>
      </div>
      <div class="sidebar-section collapsed" id="sidebarFolderSection" style="display:none">
        <div class="sidebar-header collapsible" id="sidebarFolderHeader">
          <span class="sidebar-title">In Folder</span>
          <svg class="sidebar-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="sidebar-list" id="sidebarFolder"></div>
      </div>
    </div>
    <div class="container">
      <div class="editor-pane" id="editorPane">
      </div>
      <div class="divider" id="divider"></div>
      <div class="preview-pane">
        <div class="preview-content" id="previewContent"></div>
        <div class="diff-content" id="diffContent" style="display:none"></div>
      </div>
    </div>
  </div>

  <div class="drop-overlay" id="dropOverlay">Drop to open</div>

  <div class="update-bar" id="updateBar">
    <span class="update-msg" id="updateMsg"></span>
    <button class="update-action" id="updateAction"></button>
    <button class="update-dismiss" id="updateDismiss" title="Dismiss">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- [hidden] <div id="pluginModalContainer"></div> -->

  <script type="module" src="boot.js"></script>
</body>
</html>
